

#ReplicaSet is namespace-scoped. It creates Pods using template and manages matching Pods using selector, 
#but only inside the ReplicaSet's namespace.

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  # these labels are replicaset labels
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
    component: frontend
spec:
  replicas: 10
  selector:
    # using these labels replica set selects the pod ,# using the labels in the selector only , repliaset selects the pods to create replicas
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
      component: frontend
  # This is pod definition, pod is subset of replicaset ,# this is defination of pod creation ,based on this only replica set creates pods
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.3