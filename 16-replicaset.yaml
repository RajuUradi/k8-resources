apiVersion: apps/v1
kind: ReplicaSet

metadata:
 name: nginx-ReplicaSet

 labels: # these are labels of replicaset
  project: roboshop
  component: frontend
  tier: frontend 
  env: dev

spec:
 replicas: 2

 selector: # using the labels in the selector only , repliaset selects the pods to create replicas
  matchLabels: 
   project: roboshop
   component: frontend
   tier: frontend 
   env: dev

template: # this is defination of pod creation ,based on this only replica set creates pods

  metadata:
   name: nginx pod
   labels:
     project: roboshop
     component: frontend
     tier: frontend 
     env: dev

   spec:
    containers:
     - name: nginx
       image: nginx

#ReplicaSet is namespace-scoped. It creates Pods using template and manages matching Pods using selector, 
#but only inside the ReplicaSet's namespace.